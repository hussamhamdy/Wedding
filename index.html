<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hussam & Nagah | Wedding Invitation Themes</title>
    <meta
      name="description"
      content="Choose between the classic and magical wedding invitation themes for Hussam and Nagah."
    />
    <link rel="canonical" href="https://hussamhamdy.github.io/Wedding/" />
    <meta name="theme-color" content="#15110d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hussam & Nagah | Wedding Invitation" />
    <meta
      property="og:description"
      content="Choose between the classic and magical wedding invitation themes."
    />
    <meta property="og:image" content="harry-potter/assets/images/share-preview.jpg" />
    <meta property="og:url" content="https://hussamhamdy.github.io/Wedding/" />
    <style>
      :root {
        color-scheme: dark;
        --gold: #f0d89a;
        --gold-soft: #caa45d;
        --paper: #f8efd9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background:
          radial-gradient(circle at 20% 10%, rgba(202, 164, 93, 0.22), transparent 28rem),
          radial-gradient(circle at 80% 80%, rgba(31, 76, 60, 0.24), transparent 26rem),
          linear-gradient(135deg, #0e1218, #15110d 56%, #2b1118);
        color: var(--paper);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      main {
        width: min(100%, 54rem);
        text-align: center;
      }

      .sigil {
        width: 5.5rem;
        margin: 0 auto 1.3rem;
        color: var(--gold);
        filter: drop-shadow(0 0 18px rgba(240, 216, 154, 0.34));
      }

      .sigil path,
      .sigil circle {
        fill: none;
        stroke: currentColor;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      p {
        margin: 0;
      }

      .eyebrow {
        color: var(--gold-soft);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.7rem 0 0.9rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 12vw, 6.5rem);
        font-weight: 400;
        line-height: 0.95;
      }

      .intro {
        width: min(100%, 34rem);
        margin: 0 auto;
        color: #deceb0;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .theme-grid {
        display: grid;
        gap: 1rem;
        margin-top: 2.2rem;
      }

      .theme-link {
        min-height: 10rem;
        display: grid;
        align-content: center;
        gap: 0.5rem;
        border: 1px solid rgba(240, 216, 154, 0.28);
        padding: 1.5rem;
        color: inherit;
        text-decoration: none;
        background: rgba(248, 239, 217, 0.07);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
        transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
      }

      .theme-link:hover,
      .theme-link:focus-visible {
        transform: translateY(-3px);
        border-color: rgba(240, 216, 154, 0.72);
        background: rgba(248, 239, 217, 0.11);
      }

      .theme-link strong {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 6vw, 3rem);
        font-weight: 400;
      }

      .theme-link span {
        color: #d9c491;
      }

      .classic {
        background:
          linear-gradient(135deg, rgba(248, 239, 217, 0.16), rgba(202, 164, 93, 0.08)),
          rgba(248, 239, 217, 0.07);
      }

      .magical {
        background:
          linear-gradient(135deg, rgba(59, 24, 32, 0.34), rgba(31, 76, 60, 0.22)),
          rgba(248, 239, 217, 0.07);
      }

      footer {
        margin-top: 2rem;
        color: #bca778;
        font-size: 0.92rem;
      }

      @media (min-width: 720px) {
        .theme-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="sigil" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M60 8 108 100H12Z" />
        <circle cx="60" cy="69" r="28" />
        <path d="M60 8v92" />
      </svg>
      <p class="eyebrow">Wedding Invitation</p>
      <h1>Hussam & Nagah</h1>
      <p class="intro">
        Choose the invitation style you would like to open. Both links are ready to share with guests.
      </p>

      <div class="theme-grid" aria-label="Invitation theme links">
        <a class="theme-link classic" href="classic/index.html">
          <strong>Classic</strong>
          <span>Elegant ivory and champagne invitation</span>
        </a>
        <a class="theme-link magical" href="harry-potter/index.html">
          <strong>Magical</strong>
          <span>Deathly Hallows-inspired invitation</span>
        </a>
      </div>

      <footer>Friday, November 20, 2026</footer>
    </main>
  </body>
</html>
